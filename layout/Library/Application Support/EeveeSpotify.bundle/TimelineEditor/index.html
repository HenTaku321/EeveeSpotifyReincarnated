<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>歌词内容与时间轴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="timeline-app" id="timeline-app">
    <header class="topbar">
      <div class="topbar-titles">
        <h1>歌词与时间轴</h1>
        <p id="track-subtitle">等待当前曲目</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="undo-button" type="button" aria-label="撤销" title="撤销"><span class="icon-slot" data-icon="undo"></span></button>
        <button class="icon-button" id="redo-button" type="button" aria-label="重做" title="重做"><span class="icon-slot" data-icon="redo"></span></button>
        <button class="accent-button" id="save-button" type="button"><span class="icon-slot icon-sm" data-icon="save"></span><span>保存</span></button>
      </div>
    </header>

    <section class="control-deck" aria-label="播放与同步控制">
      <div class="transport-card">
        <button class="transport-play" id="play-button" type="button" aria-label="播放或暂停">
          <span class="icon-slot" data-icon="play"></span>
          <span class="icon-slot" data-icon="pause"></span>
        </button>
        <div class="position-readout"><strong id="position-label">0:00.000</strong><span>/ <span id="duration-label">0:00.000</span></span></div>
        <input id="position-slider" type="range" min="0" max="0" value="0" step="1" aria-label="播放位置">
      </div>
      <div class="cue-row">
        <button class="cue-pill" id="cue-toggle" type="button" aria-pressed="false"><span class="pill-dot" aria-hidden="true"></span><span class="pill-text">打点</span></button>
        <button class="cue-pill" id="cue-word-toggle" type="button" aria-pressed="false"><span class="pill-dot" aria-hidden="true"></span><span class="pill-text">逐词</span></button>
        <button class="cue-button" id="cue-start" type="button" title="快捷键 W（打点开启时）">写入 start</button>
        <button class="cue-button" id="cue-end" type="button" title="快捷键 E（打点开启时）">写入 end</button>
        <button class="ghost-button" id="play-line" type="button" title="快捷键 Q">播放当前行</button>
      </div>
      <div class="cue-shortcuts" id="cue-shortcuts" data-enabled="false" aria-label="打点快捷键">
        <span class="cue-shortcut"><kbd>W</kbd><span id="cue-shortcut-w-label">start + 下一行</span></span>
        <span class="cue-shortcut"><kbd>E</kbd><span id="cue-shortcut-e-label">end + 下一行</span></span>
        <span class="cue-shortcut"><kbd>Shift</kbd> + <kbd>W</kbd><span id="cue-shortcut-back-label">上一行</span></span>
      </div>
      <div class="mode-row">
        <div class="segmented" role="group" aria-label="同步模式">
          <button type="button" data-mode="UNSYNCED">无同步</button>
          <button type="button" data-mode="LINE_SYNCED">逐行</button>
          <button type="button" data-mode="SYLLABLE_SYNCED">逐词</button>
          <button type="button" data-mode="AUTO">自动</button>
        </div>
        <output id="status" aria-live="polite"></output>
      </div>
    </section>

    <nav class="mobile-workspace-tabs segmented" role="tablist" aria-label="歌词编辑工作区">
      <button class="is-active" type="button" role="tab" aria-selected="true" aria-controls="current-panel" data-mobile-view="current">当前行</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="lines-panel" data-mobile-view="lines">整首歌词</button>
    </nav>

    <section class="workspace" data-mobile-view="current">
      <div class="current-panel" id="current-panel">
        <div class="panel-heading">
          <h2>当前行 · <span id="current-index">第 1 行</span></h2>
          <button class="ghost-button" id="next-line" type="button" title="快捷键 ↓ / 上一行 ↑"><span>下一行</span><span class="icon-slot icon-sm" data-icon="chevronRight"></span></button>
        </div>
        <label class="lyric-field"><span class="field-label">原文</span><textarea id="current-base" rows="2" dir="auto"></textarea></label>
        <label class="lyric-field lyric-field-translation"><span class="field-label">译文</span><textarea id="current-translation" rows="1" dir="auto"></textarea></label>
        <div class="time-grid">
          <label class="time-field"><span class="field-label"><span class="icon-slot icon-sm" data-icon="clock"></span>start (ms)</span><input id="current-start" inputmode="numeric"></label>
          <label class="time-field"><span class="field-label"><span class="icon-slot icon-sm" data-icon="clock"></span>end (ms)</span><input id="current-end" inputmode="numeric"></label>
        </div>
        <label class="syllables-field"><span class="field-label">逐词时间</span><textarea id="current-syllables" rows="3" placeholder="例如：1200:第一词&#10;1650:第二词"></textarea></label>
        <div class="current-actions">
          <button id="add-before" type="button"><span class="icon-slot icon-sm" data-icon="insertAbove"></span><span>前插</span></button>
          <button id="add-after" type="button"><span class="icon-slot icon-sm" data-icon="insertBelow"></span><span>后插</span></button>
          <button class="danger-button" id="delete-current" type="button"><span class="icon-slot icon-sm" data-icon="trash"></span><span>删除当前行</span></button>
        </div>
      </div>
      <div class="lines-panel" id="lines-panel">
        <div class="panel-heading">
          <h2>整首歌词 · <span id="line-count">0 行</span></h2>
          <div class="lines-heading-actions">
            <button class="ghost-button" id="segments-button" type="button"><span class="icon-slot icon-sm" data-icon="clock"></span><span>片段跳过</span></button>
            <button class="ghost-button" id="retranslate-button" type="button"><span class="icon-slot icon-sm" data-icon="lyrics"></span><span>整首重译</span></button>
            <button class="ghost-button lrc-import-button" id="lrc-import-button" type="button"><span class="icon-slot icon-sm" data-icon="arrowUp"></span><span>导入 LRC</span></button>
          </div>
        </div>
        <div class="lines-list" id="lines-list"></div>
      </div>
    </section>

    <nav class="primary-command-dock" aria-label="当前行快捷操作">
      <div class="dock-row">
        <button class="cue-button" id="dock-cue-primary" type="button">写入 start</button>
        <button id="dock-cue-end" type="button">写入 end</button>
        <button id="dock-next-line" type="button"><span>下一行</span><span class="icon-slot icon-sm" data-icon="chevronRight"></span></button>
      </div>
      <div class="dock-row">
        <button id="dock-add-before" type="button"><span class="icon-slot icon-sm" data-icon="insertAbove"></span><span>前插</span></button>
        <button id="dock-add-after" type="button"><span class="icon-slot icon-sm" data-icon="insertBelow"></span><span>后插</span></button>
        <button class="danger-button" id="dock-delete-current" type="button"><span class="icon-slot icon-sm" data-icon="trash"></span><span>删除</span></button>
      </div>
    </nav>
  </main>

  <dialog class="lrc-dialog" id="lrc-import-dialog" aria-labelledby="lrc-import-title">
    <form class="lrc-dialog-shell" method="dialog">
      <header class="lrc-dialog-header">
        <h2 id="lrc-import-title">导入 LRC</h2>
        <button class="icon-button" id="lrc-import-close" type="submit" value="cancel" aria-label="关闭" title="关闭"><span class="icon-slot" data-icon="close"></span></button>
      </header>
      <div class="lrc-dialog-body">
        <label class="lrc-import-field"><span class="field-label">LRC 文本</span><textarea id="lrc-import-input" rows="12" spellcheck="false" placeholder="[00:22.50]Hence the burden of flesh becomes resolved"></textarea></label>
        <p class="lrc-import-metadata" id="lrc-import-metadata" hidden></p>
        <output class="lrc-import-summary" id="lrc-import-summary" aria-live="polite">等待粘贴</output>
        <ul class="lrc-import-errors" id="lrc-import-errors" aria-live="polite" hidden></ul>
      </div>
      <footer class="lrc-dialog-actions">
        <button class="ghost-button" id="lrc-import-cancel" type="submit" value="cancel">取消</button>
        <button class="cue-button" id="lrc-import-confirm" type="button" disabled>替换歌词</button>
        <button id="lrc-import-translate" type="button" disabled>提交翻译并替换歌词</button>
      </footer>
    </form>
  </dialog>

  <dialog class="lrc-dialog retranslate-dialog" id="retranslate-dialog" aria-labelledby="retranslate-title">
    <form class="lrc-dialog-shell" method="dialog">
      <header class="lrc-dialog-header retranslate-header">
        <div>
          <h2 id="retranslate-title">整首重新翻译</h2>
          <span class="static-badge" id="retranslate-static-badge">读取状态中</span>
        </div>
        <button class="icon-button" id="retranslate-close" type="submit" value="cancel" aria-label="关闭" title="关闭"><span class="icon-slot" data-icon="close"></span></button>
      </header>
      <div class="lrc-dialog-body retranslate-body">
        <section id="retranslate-picker" aria-labelledby="retranslate-models-title">
          <div class="retranslate-section-heading">
            <h3 id="retranslate-models-title">选择翻译模型</h3>
          </div>
          <div class="retranslate-models" id="retranslate-models" role="radiogroup" aria-label="翻译模型"></div>
        </section>
        <section id="retranslate-review" hidden aria-labelledby="retranslate-review-title">
          <div class="retranslate-section-heading">
            <h3 id="retranslate-review-title">逐行差异</h3>
            <span id="retranslate-provenance"></span>
          </div>
          <div class="retranslate-comparison" id="retranslate-comparison"></div>
        </section>
        <output class="retranslate-status" id="retranslate-status" aria-live="polite"></output>
      </div>
      <footer class="lrc-dialog-actions retranslate-actions">
        <button class="ghost-button" id="retranslate-cancel" type="submit" value="cancel">取消</button>
        <button class="cue-button" id="retranslate-submit" type="button" disabled>生成候选</button>
        <button class="ghost-button" id="retranslate-apply" type="button" hidden>应用</button>
        <button id="retranslate-apply-static" type="button" hidden>应用并 static</button>
      </footer>
    </form>
  </dialog>
  <dialog class="lrc-dialog segment-dialog" id="segments-dialog" aria-labelledby="segments-title">
    <form class="lrc-dialog-shell" method="dialog">
      <header class="lrc-dialog-header segment-dialog-header">
        <div>
          <h2 id="segments-title">歌曲片段跳过</h2>
          <span class="static-badge" id="segments-revision">尚未载入</span>
        </div>
        <button class="icon-button" id="segments-close" type="submit" value="cancel" aria-label="关闭" title="关闭"><span class="icon-slot" data-icon="close"></span></button>
      </header>
      <div class="lrc-dialog-body segment-dialog-body">
        <div class="segment-toolbar">
          <span id="segments-count">0 个片段</span>
          <button class="ghost-button" id="segment-add" type="button"><span class="icon-slot icon-sm" data-icon="plus"></span><span>新增片段</span></button>
        </div>
        <div class="segment-list" id="segments-list"></div>
        <output class="retranslate-status" id="segments-status" aria-live="polite"></output>
      </div>
      <footer class="lrc-dialog-actions segment-dialog-actions">
        <button class="ghost-button" id="segments-cancel" type="submit" value="cancel">取消</button>
        <button class="ghost-button" id="segments-load-conflict" type="button" hidden>载入服务端版本</button>
        <button class="cue-button" id="segments-save" type="button" disabled>保存规则</button>
      </footer>
    </form>
  </dialog>
  <script src="./icons.js"></script>
  <script src="./editor-state.js"></script>
  <script src="./browser-host.js"></script>
  <script src="./app.js"></script>
</body>
</html>
