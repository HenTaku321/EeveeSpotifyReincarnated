<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>歌词编辑器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="timeline-app" id="timeline-app">
    <header class="topbar">
      <div class="identity">
        <span class="mark" aria-hidden="true">♪</span>
        <div><h1>歌词编辑器</h1><p id="track-subtitle">等待当前曲目</p></div>
      </div>
      <div class="top-actions">
        <button id="undo-button" type="button" title="撤销">↶</button>
        <button id="redo-button" type="button" title="重做">↷</button>
        <button class="primary" id="save-button" type="button">保存</button>
      </div>
    </header>

    <section class="transport" aria-label="播放控制">
      <div class="transport-main">
        <button class="round-control" id="play-button" type="button" aria-label="播放或暂停">▶</button>
        <div class="position-readout"><strong id="position-label">0:00.000</strong><span>/ <span id="duration-label">0:00.000</span></span></div>
        <input id="position-slider" type="range" min="0" max="0" value="0" step="1" aria-label="播放位置">
      </div>
      <div class="cue-controls">
        <button id="cue-toggle" type="button">打点：关</button>
        <button id="cue-word-toggle" type="button">逐词：关</button>
        <button id="cue-start" type="button">写入 start</button>
        <button id="cue-end" type="button">写入 end</button>
        <button id="preview-line" type="button">播放当前行</button>
      </div>
    </section>

    <section class="modebar" aria-label="同步模式">
      <span class="mode-label">同步模式</span>
      <div class="modes" role="group">
        <button type="button" data-mode="UNSYNCED"><span class="mode-long">UNSYNCED</span><span class="mode-short">无同步</span></button>
        <button type="button" data-mode="LINE_SYNCED"><span class="mode-long">LINE_SYNCED</span><span class="mode-short">逐行</span></button>
        <button type="button" data-mode="SYLLABLE_SYNCED"><span class="mode-long">SYLLABLE_SYNCED</span><span class="mode-short">逐词</span></button>
        <button type="button" data-mode="AUTO"><span class="mode-long">AUTO</span><span class="mode-short">自动</span></button>
      </div>
      <output id="status" aria-live="polite"></output>
    </section>

    <nav class="mobile-workspace-tabs" role="tablist" aria-label="歌词编辑工作区">
      <button class="is-active" type="button" role="tab" aria-selected="true" aria-controls="current-panel" data-mobile-view="current">当前行</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="lines-panel" data-mobile-view="lines">整首歌词</button>
    </nav>

    <section class="workspace" data-mobile-view="current">
      <div class="current-panel" id="current-panel">
        <div class="panel-heading"><div><span class="eyebrow">CURRENT LINE</span><h2 id="current-index">第 1 行</h2></div><button id="next-line" type="button">下一行 →</button></div>
        <label>原文<textarea id="current-base" rows="3" dir="auto"></textarea></label>
        <label>翻译<textarea id="current-translation" rows="2" dir="auto"></textarea></label>
        <div class="time-grid"><label>start (ms)<input id="current-start" inputmode="numeric"></label><label>end (ms)<input id="current-end" inputmode="numeric"></label></div>
        <label class="syllables-label">逐词时间 <textarea id="current-syllables" rows="3" placeholder="例如：1200:第一词\n1650:第二词"></textarea></label>
        <div class="current-actions"><button id="add-before" type="button">前面加行</button><button id="add-after" type="button">后面加行</button><button class="danger" id="delete-current" type="button">删除当前行</button></div>
      </div>
      <div class="lines-panel" id="lines-panel">
        <div class="panel-heading"><div><span class="eyebrow">LYRICS</span><h2>整首歌词</h2></div><span class="count" id="line-count">0 行</span></div>
        <div class="lines-list" id="lines-list"></div>
      </div>
    </section>
  </main>
  <script src="./editor-state.js"></script>
  <script src="./app.js"></script>
</body>
</html>
